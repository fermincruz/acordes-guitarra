<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16120f">
<title>Afinador · Guitarra</title>
<style>
  :root{
    --bg:#16120f; --panel:#211b17; --line:#3a2f27; --text:#f3ebe2; --dim:#a8998a;
    --ok:#3ddc84; --warn:#ffb020; --bad:#ff5a4e; --accent:#ff7a45; --sel:#2e2219;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;
    user-select:none;-webkit-user-select:none}
  #app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto auto auto;
    padding:max(10px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));gap:10px}

  /* Barra superior */
  header{display:flex;align-items:center;gap:8px}
  #tuningBtn{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;
    padding:10px 12px;font-size:15px;text-align:left}
  #tuningBtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #tuningBtn small{color:var(--dim);font-size:12px;flex:none}
  #chordsLink{flex:none;height:44px;padding:0 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);
    color:var(--accent);font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;text-decoration:none}
  .iconBtn{flex:none;width:44px;height:44px;border-radius:12px;background:var(--panel);
    border:1px solid var(--line);color:var(--text);font-size:19px;display:grid;place-items:center}
  .iconBtn:disabled{opacity:.35}

  /* Zona central */
  #display{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;position:relative}
  #noteWrap{display:flex;align-items:flex-start;line-height:1}
  #noteWrap.idle #note{opacity:.18;font-weight:300}
  #note{font-size:clamp(72px,24vh,150px);font-weight:700;letter-spacing:-.03em}
  #noteSide{display:flex;flex-direction:column;justify-content:space-between;margin-left:4px;
    height:clamp(60px,19vh,118px);padding-top:.15em}
  #acc{font-size:clamp(28px,8vh,54px);font-weight:600}
  #oct{font-size:clamp(18px,4.5vh,30px);color:var(--dim);font-weight:500}
  #cents{font-size:clamp(18px,3.6vh,26px);font-variant-numeric:tabular-nums;margin-top:4px;min-height:1.2em;font-weight:600}
  #sub{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;min-height:1.3em;margin-top:2px;text-align:center}
  #hint{position:absolute;top:4px;left:0;right:0;text-align:center;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  #gaugeBox{position:relative;height:clamp(120px,24vh,210px);min-height:0}
  canvas{position:absolute;inset:0;width:100%;height:100%}

  /* Cuerdas */
  #strings{display:flex;gap:6px;justify-content:center}
  .str{flex:1;max-width:64px;aspect-ratio:1/1.05;border-radius:12px;background:var(--panel);
    border:1.5px solid var(--line);color:var(--text);font-size:clamp(14px,4.2vw,18px);font-weight:600;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;
    transition:border-color .15s,background .15s}
  .str small{font-size:10px;color:var(--dim);font-weight:500}
  .str.active{border-color:var(--accent);background:var(--sel)}
  .str.locked{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
  .str.tuned::after{content:"✓";position:absolute;top:2px;right:5px;font-size:11px;color:var(--ok)}
  #strings.chromatic{display:none}
  #modeInfo{display:none;text-align:center;color:var(--dim);font-size:13px;padding:6px 0}
  #modeInfo.show{display:block}

  /* Botón principal */
  #mainBtn{height:56px;border-radius:16px;border:none;font-size:17px;font-weight:650;
    background:var(--accent);color:#1a0f08;letter-spacing:.01em}
  #mainBtn.on{background:var(--panel);color:var(--text);border:1px solid var(--line)}
  #err{color:var(--bad);font-size:13px;text-align:center;display:none}
  #err.show{display:block}

  /* Panel de ajustes */
  #sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:5}
  #sheet.show{display:flex}
  #sheetBody{width:100%;max-height:88dvh;overflow:auto;background:var(--panel);border-radius:20px 20px 0 0;
    padding:16px 16px max(18px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  #sheetBody h2{font-size:13px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin:6px 2px 8px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
  .opt{background:var(--bg);border:1.5px solid var(--line);color:var(--text);border-radius:12px;padding:10px;
    text-align:left;font-size:14px;line-height:1.25}
  .opt small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
  .opt.sel{border-color:var(--accent);background:var(--sel)}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .row .lbl{flex:1;font-size:15px}
  .step{width:42px;height:42px;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:var(--text);font-size:20px}
  #a4Val{min-width:72px;text-align:center;font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
  .seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{background:none;border:none;color:var(--dim);padding:10px 14px;font-size:14px}
  .seg button.sel{background:var(--sel);color:var(--text)}
  #closeSheet{width:100%;height:48px;border-radius:12px;border:none;background:var(--accent);color:#1a0f08;font-size:16px;font-weight:650}
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="tuningBtn" aria-label="Cambiar afinación"><span id="tuningName">Estándar</span><small id="a4Small">La 440 Hz</small></button>
    <button class="iconBtn" id="toneBtn" aria-label="Escuchar nota de referencia" title="Escuchar nota de referencia" disabled>♪</button>
    <a id="chordsLink" href="acordes.html" aria-label="Ver acordes">Acordes ›</a>
  </header>

  <section id="display">
    <div id="hint">Pulsa «Empezar» y toca una cuerda</div>
    <div id="noteWrap"><span id="note">–</span><span id="noteSide"><span id="acc"></span><span id="oct"></span></span></div>
    <div id="cents">&nbsp;</div>
    <div id="sub">&nbsp;</div>
  </section>

  <div id="gaugeBox"><canvas id="gauge"></canvas></div>

  <div>
    <div id="strings"></div>
    <div id="modeInfo"></div>
  </div>

  <div style="display:grid;gap:6px">
    <div id="err"></div>
    <button id="mainBtn">Empezar</button>
  </div>
</div>

<div id="sheet">
  <div id="sheetBody">
    <h2>Afinación</h2>
    <div class="opts" id="tuningOpts"></div>
    <h2>Referencia</h2>
    <div class="row">
      <span class="lbl">La (A4)</span>
      <button class="step" id="a4Minus">−</button>
      <span id="a4Val">440 Hz</span>
      <button class="step" id="a4Plus">+</button>
    </div>
    <h2>Nombres de notas</h2>
    <div class="row">
      <div class="seg" id="namingSeg">
        <button data-v="latin">Do Re Mi</button>
        <button data-v="anglo">C D E</button>
      </div>
    </div>
    <button id="closeSheet">Listo</button>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   Datos de notas y afinaciones
   ============================================================ */
const SHARP = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
const FLAT  = ["C","D♭","D","E♭","E","F","G♭","G","A♭","A","B♭","B"];
const LATIN = {C:"Do",D:"Re",E:"Mi",F:"Fa",G:"Sol",A:"La",B:"Si"};

// Nota escrita como "E2", "Eb2", "F#3" → número MIDI
function midiOf(s){
  const m = /^([A-G])([#b]?)(-?\d)$/.exec(s);
  const base = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];
  return (parseInt(m[3])+1)*12 + base + (m[2]==="#"?1:m[2]==="b"?-1:0);
}

const TUNINGS = [
  {id:"std",   name:"Estándar",          desc:"Mi La Re Sol Si Mi", notes:["E2","A2","D3","G3","B3","E4"]},
  {id:"half",  name:"Medio tono abajo",  desc:"Mi♭ La♭ Re♭ …",      notes:["Eb2","Ab2","Db3","Gb3","Bb3","Eb4"], flats:true},
  {id:"dropd", name:"Drop D",            desc:"Re La Re Sol Si Mi", notes:["D2","A2","D3","G3","B3","E4"]},
  {id:"dropc", name:"Drop C",            desc:"Do Sol Do Fa La Re", notes:["C2","G2","C3","F3","A3","D4"]},
  {id:"dadgad",name:"DADGAD",            desc:"Re La Re Sol La Re", notes:["D2","A2","D3","G3","A3","D4"]},
  {id:"openg", name:"Open G",            desc:"Re Sol Re Sol Si Re",notes:["D2","G2","D3","G3","B3","D4"]},
  {id:"opend", name:"Open D",            desc:"Re La Re Fa♯ La Re", notes:["D2","A2","D3","F#3","A3","D4"]},
  {id:"bass",  name:"Bajo 4 cuerdas",    desc:"Mi La Re Sol",       notes:["E1","A1","D2","G2"]},
  {id:"uke",   name:"Ukelele",           desc:"Sol Do Mi La",       notes:["G4","C4","E4","A4"]},
  {id:"chrom", name:"Cromático",         desc:"Todas las notas",    chromatic:"all"},
  {id:"nat",   name:"Notas naturales",   desc:"Sin semitonos",      chromatic:"natural"},
];

/* ============================================================
   Estado y preferencias
   ============================================================ */
const store = {
  get(k,d){ try{ const v = localStorage.getItem("afinador."+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem("afinador."+k, JSON.stringify(v)); }catch(e){} }
};
const S = {
  tuning: TUNINGS.find(t=>t.id===store.get("tuning","std")) || TUNINGS[0],
  a4: store.get("a4",440),
  naming: store.get("naming","latin"),
  locked: -1,          // índice de cuerda fijada (-1 = automático)
  active: -1,          // cuerda que se está afinando ahora
  tuned: new Set(),
  running:false,
};
const freqOfMidi = m => S.a4 * Math.pow(2,(m-69)/12);

function noteParts(midi, flats){
  const pc = ((midi%12)+12)%12, oct = Math.floor(midi/12)-1;
  const n = (flats?FLAT:SHARP)[pc];
  let letter = n[0], acc = n.slice(1);
  if (S.naming==="latin") letter = LATIN[letter];
  return {letter, acc, oct};
}
const noteLabel = (midi,flats) => { const p = noteParts(midi,flats); return p.letter+p.acc; };

/* ============================================================
   Detección de tono: YIN (como la app original) con mejoras
   ============================================================ */
function yin(buf, sr, minF, maxF){
  const minLag = Math.max(2, Math.floor(sr/maxF));
  const maxLag = Math.ceil(sr/minF);
  const W = Math.min(4096, buf.length - maxLag - 2);
  if (W < 512) return null;
  const d = new Float32Array(maxLag+2), c = new Float32Array(maxLag+2);
  c[0] = 1;
  let run = 0;
  for (let tau=1; tau<=maxLag+1; tau++){
    let s = 0;
    for (let i=0;i<W;i++){ const x = buf[i]-buf[i+tau]; s += x*x; }
    d[tau] = s; run += s;
    c[tau] = run>0 ? s*tau/run : 1;
  }
  // Primer valle por debajo del umbral (evita errores de octava)
  const TH = 0.15;
  let tau = -1;
  for (let t=minLag; t<=maxLag; t++){
    if (c[t] < TH){ while (t+1<=maxLag && c[t+1]<c[t]) t++; tau = t; break; }
  }
  // Si no hay valle claro, el mínimo global si es aceptable
  if (tau<0){
    let best = 1, bt = -1;
    for (let t=minLag; t<=maxLag; t++) if (c[t]<best){best=c[t];bt=t;}
    if (bt<0 || best>0.3) return null;
    tau = bt;
  }
  // Interpolación parabólica sobre la curva normalizada
  let shift = 0;
  if (tau>1 && tau<=maxLag){
    const a=c[tau-1], b=c[tau], g=c[tau+1], den = a-2*b+g;
    if (den>0) shift = 0.5*(a-g)/den;
    if (Math.abs(shift)>1) shift = 0;
  }
  const f = sr/(tau+shift);
  if (f<minF || f>maxF) return null;
  return {f, clarity: 1-c[tau]};
}

/* Suavizado: mediana de 5 + media exponencial en escala logarítmica,
   como en la app, pero reiniciando al cambiar de nota y con
   tiempo de retención en vez de número de tramas. */
const smoother = {
  hist:[], val:null, lastSeen:0,
  update(f, now){
    if (f){
      const l = Math.log2(f);
      if (this.val!==null && Math.abs(l-this.val)*1200 > 70){ this.hist=[]; this.val=null; }
      this.hist.push(l); if (this.hist.length>5) this.hist.shift();
      const med = [...this.hist].sort((a,b)=>a-b)[this.hist.length>>1];
      this.val = this.val===null ? med : this.val + 0.35*(med-this.val);
      this.lastSeen = now;
      return Math.pow(2,this.val);
    }
    if (this.val!==null && now-this.lastSeen < 350) return Math.pow(2,this.val);
    this.hist=[]; this.val=null; return null;
  },
  reset(){ this.hist=[]; this.val=null; }
};

/* ============================================================
   Audio
   ============================================================ */
let ctx=null, stream=null, analyser=null, hp=null, lp=null, buf=null, wakeLock=null;

function rangeForTuning(){
  if (S.tuning.chromatic) return {minF:38, maxF:1400};
  const fs = S.tuning.notes.map(n=>freqOfMidi(midiOf(n)));
  return {minF: Math.max(28, Math.min(...fs)*0.7), maxF: Math.min(1500, Math.max(...fs)*1.6)};
}
function applyFilters(){
  if (!hp) return;
  const r = rangeForTuning();
  hp.frequency.value = r.minF*0.8;
  lp.frequency.value = Math.min(5000, r.maxF*2.5);
}

async function start(){
  showErr("");
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false, noiseSuppression:false, autoGainControl:false
    }});
  }catch(e){
    showErr(e && e.name==="NotAllowedError"
      ? "Se necesita permiso de micrófono para afinar."
      : "No se pudo acceder al micrófono ("+(e&&e.name||"error")+").");
    return;
  }
  ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
  if (ctx.state==="suspended") await ctx.resume();
  const src = ctx.createMediaStreamSource(stream);
  hp = ctx.createBiquadFilter(); hp.type="highpass"; hp.Q.value=0.7;
  lp = ctx.createBiquadFilter(); lp.type="lowpass";  lp.Q.value=0.7;
  analyser = ctx.createAnalyser(); analyser.fftSize = 8192;
  buf = new Float32Array(analyser.fftSize);
  src.connect(hp); hp.connect(lp); lp.connect(analyser);
  applyFilters();
  S.running = true;
  smoother.reset();
  requestWake();
  render();
}
function stop(){
  S.running=false;
  if (stream) stream.getTracks().forEach(t=>t.stop());
  stream=null; analyser=null;
  releaseWake();
  render();
}
async function requestWake(){
  try{ if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); }catch(e){}
}
function releaseWake(){ try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock=null; }
document.addEventListener("visibilitychange",()=>{
  if (document.visibilityState==="visible" && S.running){ requestWake(); if (ctx && ctx.state==="suspended") ctx.resume(); }
});

/* Nota de referencia */
function playTone(){
  const m = targetMidi(); if (m===null) return;
  ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
  if (ctx.state==="suspended") ctx.resume();
  const f = freqOfMidi(m), t = ctx.currentTime;
  const g = ctx.createGain(); g.connect(ctx.destination);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.35,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,t+2.2);
  [[1,1],[2,0.4],[3,0.18]].forEach(([h,a])=>{
    const o = ctx.createOscillator(), og = ctx.createGain();
    o.type="sine"; o.frequency.value=f*h; og.gain.value=a;
    o.connect(og); og.connect(g); o.start(t); o.stop(t+2.3);
  });
}

/* ============================================================
   Lógica del afinador
   ============================================================ */
let reading = null;       // {midi, cents, f, flats}
let inTuneSince = 0;

function targetMidi(){
  if (S.tuning.chromatic) return reading ? reading.midi : null;
  const i = S.locked>=0 ? S.locked : S.active;
  return i>=0 ? midiOf(S.tuning.notes[i]) : null;
}

function analyse(now){
  analyser.getFloatTimeDomainData(buf);
  // Puerta de ruido
  let rms=0; for (let i=0;i<buf.length;i++) rms+=buf[i]*buf[i];
  rms = Math.sqrt(rms/buf.length);
  const r = rangeForTuning();
  const det = rms>0.004 ? yin(buf.subarray(buf.length-5600), ctx.sampleRate, r.minF, r.maxF) : null;
  const f = smoother.update(det && det.clarity>0.7 ? det.f : null, now);
  if (!f){ reading=null; return; }

  const exact = 69 + 12*Math.log2(f/S.a4);
  const t = S.tuning;
  if (t.chromatic==="all"){
    const m = Math.round(exact);
    reading = {midi:m, cents:(exact-m)*100, f};
  } else if (t.chromatic==="natural"){
    let best=null;
    for (const d of [-1,0,1]){
      const m = Math.round(exact)+d;
      if (![0,2,4,5,7,9,11].includes(((m%12)+12)%12)) continue;
      if (best===null || Math.abs(exact-m)<Math.abs(exact-best)) best=m;
    }
    reading = {midi:best, cents:(exact-best)*100, f};
  } else {
    let idx = S.locked;
    if (idx<0){
      // Cuerda más cercana, con histéresis para que no salte
      let bi=-1, bd=1e9;
      t.notes.forEach((n,i)=>{ const dd=Math.abs(exact-midiOf(n)); if (dd<bd){bd=dd;bi=i;} });
      if (S.active>=0 && S.active!==bi){
        const cur = Math.abs(exact-midiOf(t.notes[S.active]));
        if (cur - bd < 0.35) bi = S.active;
      }
      idx = bi;
    }
    S.active = idx;
    const m = midiOf(t.notes[idx]);
    reading = {midi:m, cents:(exact-m)*100, f, played:Math.round(exact), flats:t.flats};
  }

  // "Afinada" tras mantenerse ±3 cents durante 0,5 s
  if (Math.abs(reading.cents)<=3){
    if (!inTuneSince) inTuneSince = now;
    if (now-inTuneSince>500 && !S.tuning.chromatic && !S.tuned.has(S.active)){
      S.tuned.add(S.active);
      try{ navigator.vibrate && navigator.vibrate(40); }catch(e){}
      buildStrings();
    }
  } else inTuneSince = 0;
}

/* ============================================================
   Interfaz
   ============================================================ */
const $ = id => document.getElementById(id);
const els = {note:$("note"),acc:$("acc"),oct:$("oct"),cents:$("cents"),sub:$("sub"),hint:$("hint"),
  wrap:$("noteWrap"),strings:$("strings"),modeInfo:$("modeInfo"),btn:$("mainBtn"),tone:$("toneBtn")};

function colorFor(c){ const a=Math.abs(c); return a<=3?"var(--ok)":a<=12?"var(--warn)":"var(--bad)"; }
function rawColor(c){ const a=Math.abs(c); return a<=3?"#3ddc84":a<=12?"#ffb020":"#ff5a4e"; }

function buildStrings(){
  const t = S.tuning;
  els.strings.classList.toggle("chromatic", !!t.chromatic);
  els.modeInfo.classList.toggle("show", !!t.chromatic);
  if (t.chromatic){
    els.modeInfo.textContent = t.chromatic==="all" ? "Modo cromático: detecta cualquier nota" : "Solo notas naturales (sin sostenidos ni bemoles)";
    els.strings.innerHTML=""; return;
  }
  els.strings.innerHTML = "";
  t.notes.forEach((n,i)=>{
    const b = document.createElement("button");
    b.className = "str"+(i===S.active?" active":"")+(i===S.locked?" locked":"")+(S.tuned.has(i)?" tuned":"");
    const m = midiOf(n), p = noteParts(m,t.flats);
    b.innerHTML = `${p.letter}${p.acc}<small>${t.notes.length-i}ª · ${p.oct}</small>`;
    b.onclick = ()=>{ S.locked = S.locked===i ? -1 : i; S.active = i; smoother.reset(); buildStrings(); render(); };
    els.strings.appendChild(b);
  });
}

function render(){
  els.btn.textContent = S.running ? "Detener" : "Empezar";
  els.btn.classList.toggle("on", S.running);
  els.tone.disabled = targetMidi()===null;
  $("tuningName").textContent = S.tuning.name;
  $("a4Small").textContent = (S.naming==="latin"?"La ":"A4 ")+S.a4+" Hz";

  if (!S.running){
    els.hint.textContent = "Pulsa «Empezar»";
  } else if (!S.tuning.chromatic){
    els.hint.textContent = S.locked>=0 ? "Cuerda fijada · tócala otra vez para soltarla" : "Automático · toca una cuerda para fijarla";
  } else els.hint.textContent = "Escuchando…";

  if (reading){
    const p = noteParts(reading.midi, reading.flats);
    els.wrap.classList.remove("idle");
    els.note.textContent = p.letter; els.acc.textContent = p.acc; els.oct.textContent = p.oct;
    const c = reading.cents, col = colorFor(c);
    els.wrap.style.color = col;
    const r = Math.round(c);
    els.cents.style.color = col;
    els.cents.textContent = Math.abs(c)<=3 ? "Afinada" : (r>0?"+":"")+r+" cents · "+(c<0?"sube ↑":"baja ↓");
    let sub = reading.f.toFixed(1)+" Hz";
    if (reading.played!==undefined && Math.abs(c)>60) sub += " · suena "+noteLabel(reading.played, reading.flats);
    els.sub.textContent = sub;
  } else {
    const m = targetMidi();
    if (m!==null && !S.tuning.chromatic){
      const p = noteParts(m,S.tuning.flats);
      els.wrap.classList.remove("idle");
      els.note.textContent=p.letter; els.acc.textContent=p.acc; els.oct.textContent=p.oct;
      els.sub.textContent = freqOfMidi(m).toFixed(1)+" Hz objetivo";
    } else {
      els.note.textContent="–"; els.acc.textContent=""; els.oct.textContent=""; els.sub.innerHTML="&nbsp;"; els.wrap.classList.add("idle");
    }
    els.wrap.style.color="var(--dim)";
    els.cents.innerHTML = S.running ? "Toca una cuerda" : "&nbsp;";
    els.cents.style.color="var(--dim)";
  }
}

/* Indicador de aguja */
const cv = $("gauge"), g2 = cv.getContext("2d");
let needle = 0, needleTarget = 0, needleAlpha = 0;
function sizeCanvas(){
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio||1;
  cv.width = Math.round(r.width*dpr); cv.height = Math.round(r.height*dpr);
}
new ResizeObserver(sizeCanvas).observe($("gaugeBox"));

function drawGauge(){
  const W=cv.width, H=cv.height, dpr=window.devicePixelRatio||1;
  g2.clearRect(0,0,W,H);
  const R = Math.min(W/2-14*dpr, H-22*dpr);
  const cx = W/2, cy = H-8*dpr;
  const span = Math.PI*0.78;                  // apertura total del arco
  const ang = c => -Math.PI/2 + (c/50)*(span/2);

  // Zona "afinada"
  g2.lineCap="butt";
  g2.lineWidth = 10*dpr;
  g2.strokeStyle = "rgba(61,220,132,.22)";
  g2.beginPath(); g2.arc(cx,cy,R,ang(-3),ang(3)); g2.stroke();
  g2.strokeStyle = "rgba(255,176,32,.10)";
  g2.beginPath(); g2.arc(cx,cy,R,ang(-12),ang(-3)); g2.stroke();
  g2.beginPath(); g2.arc(cx,cy,R,ang(3),ang(12)); g2.stroke();

  // Marcas
  for (let c=-50;c<=50;c+=5){
    const a = ang(c), big = c%25===0, len = (big?16:c%10===0?10:6)*dpr;
    g2.strokeStyle = c===0 ? "#f3ebe2" : big ? "#a8998a" : "#4a3d33";
    g2.lineWidth = (c===0?3:big?2:1.5)*dpr;
    g2.beginPath();
    g2.moveTo(cx+Math.cos(a)*(R-len), cy+Math.sin(a)*(R-len));
    g2.lineTo(cx+Math.cos(a)*R, cy+Math.sin(a)*R);
    g2.stroke();
    if (big && c!==0){
      g2.fillStyle="#a8998a"; g2.font=`${11*dpr}px system-ui`; g2.textAlign="center"; g2.textBaseline="middle";
      g2.fillText((c>0?"+":"")+c, cx+Math.cos(a)*(R-30*dpr), cy+Math.sin(a)*(R-30*dpr));
    }
  }
  g2.fillStyle="#a8998a"; g2.font=`600 ${14*dpr}px system-ui`; g2.textBaseline="alphabetic";
  g2.textAlign="left";  g2.fillText("♭", cx+Math.cos(ang(-50))*R-4*dpr, cy+Math.sin(ang(-50))*R-14*dpr);
  g2.textAlign="right"; g2.fillText("♯", cx+Math.cos(ang(50))*R+4*dpr,  cy+Math.sin(ang(50))*R-14*dpr);

  // Aguja
  if (needleAlpha>0.01){
    const c = Math.max(-52, Math.min(52, needle)), a = ang(c);
    g2.globalAlpha = needleAlpha;
    const col = rawColor(needleTarget);
    g2.strokeStyle = col; g2.lineCap="round"; g2.lineWidth = 4*dpr;
    g2.beginPath(); g2.moveTo(cx,cy); g2.lineTo(cx+Math.cos(a)*(R-4*dpr), cy+Math.sin(a)*(R-4*dpr)); g2.stroke();
    g2.fillStyle = col; g2.beginPath(); g2.arc(cx,cy,7*dpr,0,Math.PI*2); g2.fill();
    if (Math.abs(needleTarget)<=3){
      g2.lineWidth=10*dpr; g2.lineCap="butt"; g2.strokeStyle="rgba(61,220,132,.9)";
      g2.beginPath(); g2.arc(cx,cy,R,ang(-3),ang(3)); g2.stroke();
    }
    g2.globalAlpha = 1;
  }
  g2.fillStyle="#3a2f27"; g2.beginPath(); g2.arc(cx,cy,4*dpr,0,Math.PI*2); g2.fill();
}

let lastAnalyse = 0;
function loop(now){
  if (S.running && analyser && now-lastAnalyse>=35){
    lastAnalyse = now;
    const prevActive = S.active;
    analyse(now);
    if (prevActive!==S.active) buildStrings();
    render();
  }
  if (reading){ needleTarget = reading.cents; needleAlpha += (1-needleAlpha)*0.25; }
  else needleAlpha += (0-needleAlpha)*0.12;
  needle += (needleTarget-needle)*0.22;
  drawGauge();
  requestAnimationFrame(loop);
}

function showErr(m){ const e=$("err"); e.textContent=m; e.classList.toggle("show",!!m); }

/* Ajustes */
function buildSheet(){
  const o = $("tuningOpts"); o.innerHTML="";
  TUNINGS.forEach(t=>{
    const b=document.createElement("button");
    b.className="opt"+(t===S.tuning?" sel":"");
    b.innerHTML=`${t.name}<small>${t.desc}</small>`;
    b.onclick=()=>{ S.tuning=t; store.set("tuning",t.id); S.locked=-1; S.active=-1; S.tuned.clear();
      reading=null; smoother.reset(); applyFilters(); buildSheet(); buildStrings(); render(); };
    o.appendChild(b);
  });
  $("a4Val").textContent = S.a4+" Hz";
  document.querySelectorAll("#namingSeg button").forEach(b=>b.classList.toggle("sel", b.dataset.v===S.naming));
}
$("tuningBtn").onclick=()=>{ buildSheet(); $("sheet").classList.add("show"); };
$("closeSheet").onclick=()=>$("sheet").classList.remove("show");
$("sheet").onclick=e=>{ if (e.target.id==="sheet") $("sheet").classList.remove("show"); };
const setA4 = v=>{ S.a4=Math.max(415,Math.min(466,v)); store.set("a4",S.a4); applyFilters(); buildSheet(); render(); };
$("a4Minus").onclick=()=>setA4(S.a4-1);
$("a4Plus").onclick=()=>setA4(S.a4+1);
document.querySelectorAll("#namingSeg button").forEach(b=>b.onclick=()=>{
  S.naming=b.dataset.v; store.set("naming",S.naming); buildSheet(); buildStrings(); render();
});

els.btn.onclick=()=> S.running ? stop() : start();
els.tone.onclick=playTone;

if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
  showErr("Este navegador no permite usar el micrófono aquí. Ábrelo por HTTPS (p. ej. GitHub Pages).");
}
buildStrings(); render(); requestAnimationFrame(loop);
</script>
